<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>📦 อัปเดตสถานะใบสั่งงาน - TN Messenger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Protect Route
      const token = localStorage.getItem("tn_employee_token");
      if (!token) {
        window.location.href = "login_employee.html";
      }
    </script>
    <link rel="stylesheet" href="/src/styles/global.css" />
    <link rel="stylesheet" href="/src/styles/update_status.css" />
    <script type="module" src="/src/js/update_status.js"></script>
  </head>

  <body>
    <div class="box">
      <h1>📦 อัปเดตสถานะใบสั่งงาน</h1>
      <p id="orderInfo">⚙️ กรอกเลขที่ใบสั่งงานเพื่ออัปเดตสถานะ</p>

      <!-- UI สรุปผล -->
      <div id="summary-container"></div>

      <div id="fetch-loading" style="display: none;">
        <i data-feather="loader" class="spin" style="color: #2563eb; width: 32px; height: 32px;"></i>
        <p style="margin-top: 8px; color: #475569;">กำลังดึงข้อมูลงาน...</p>
      </div>

      <form id="updateForm">
        <label for="orderNoInput">เลขที่ใบสั่งงาน</label>
        <input
          type="text"
          name="orderNo"
          id="orderNoInput"
          placeholder="เช่น 0001"
          required
        /><br />

        <div class="input-group" style="margin-top: 10px;">
          <label for="messengerName">👤 ชื่อพนักงาน (ผู้ทำการวิ่งงาน)</label>
          <input
            type="text"
            name="messengerName"
            id="messengerName"
            placeholder="กรอกชื่อพนักงาน"
            required
          />
        </div>

        <div class="input-group" style="margin-top: 15px;">
          <label for="customerName">👥 ชื่อลูกค้า</label>
          <input
            type="text"
            id="customerName"
            placeholder="ชื่อลูกค้า"
            readonly
            style="background: #f9fafb;"
          />
        </div>
        <br />

        <div class="result-section" id="section1">
          <h3>🚚 ผลการวิ่งงาน 1</h3>
          <label for="result1">สถานะ</label>
          <select name="result1" id="result1" onchange="togglePostponeDate(1)">
            <option value="">-- เลือกสถานะ --</option>
            <option>สำเร็จ</option>
            <option>ลูกค้าขอเลื่อน</option>
            <option>ลูกค้าไม่รับสาย</option>
            <option>พนักงานขอเลื่อน</option>
            <option>ลูกค้าขอยกเลิก</option>
            <option>ใบหน้างานซ้ำ</option>
          </select>

          <div id="date-postpone-container-1" class="date-reschedule-container">
            <label for="rescheduledDate1">📅 วันที่ขอเลื่อนไปเป็นวันที่</label>
            <input type="text" id="rescheduledDate1" name="rescheduledDate1" placeholder="คลิกเพื่อเลือกวันที่">
          </div>

          <label for="note1">หมายเหตุ</label>
          <textarea
            name="note1"
            id="note1"
            placeholder="บันทึกเพิ่มเติม..."
          ></textarea>
        </div>

        <div class="result-section" id="section2">
          <h3>🚚 ผลการวิ่งงาน 2</h3>
          <label for="result2">สถานะ</label>
          <select name="result2" id="result2" onchange="togglePostponeDate(2)">
            <option value="">-- เลือกสถานะ --</option>
            <option>สำเร็จ</option>
            <option>ลูกค้าขอเลื่อน</option>
            <option>ลูกค้าไม่รับสาย</option>
            <option>พนักงานขอเลื่อน</option>
            <option>ลูกค้าขอยกเลิก</option>
            <option>ใบหน้างานซ้ำ</option>
          </select>

          <div id="date-postpone-container-2" class="date-reschedule-container">
            <label for="rescheduledDate2">📅 วันที่ขอเลื่อนไปเป็นวันที่</label>
            <input type="text" id="rescheduledDate2" name="rescheduledDate2" placeholder="คลิกเพื่อเลือกวันที่">
          </div>

          <label for="note2">หมายเหตุ</label>
          <textarea
            name="note2"
            id="note2"
            placeholder="บันทึกเพิ่มเติม..."
          ></textarea>
        </div>

        <div class="result-section" id="section3">
          <h3>🚚 ผลการวิ่งงาน 3</h3>
          <label for="result3">สถานะ</label>
          <select name="result3" id="result3" onchange="togglePostponeDate(3)">
            <option value="">-- เลือกสถานะ --</option>
            <option>สำเร็จ</option>
            <option>ลูกค้าขอเลื่อน</option>
            <option>ลูกค้าไม่รับสาย</option>
            <option>พนักงานขอเลื่อน</option>
            <option>ลูกค้าขอยกเลิก</option>
            <option>ใบหน้างานซ้ำ</option>
          </select>

          <div id="date-postpone-container-3" class="date-reschedule-container">
            <label for="rescheduledDate3">📅 วันที่ขอเลื่อนไปเป็นวันที่</label>
            <input type="text" id="rescheduledDate3" name="rescheduledDate3" placeholder="คลิกเพื่อเลือกวันที่">
          </div>

          <label for="note3">หมายเหตุ</label>
          <textarea
            name="note3"
            id="note3"
            placeholder="บันทึกเพิ่มเติม..."
          ></textarea>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 20px; font-size: 16px; padding: 12px; font-weight: 600; border-radius: 10px; cursor: pointer; background: var(--primary, #1e3a8a); color: #fff; border: none;">💾 บันทึกสถานะ</button>

        <div id="resultMsg"></div>

        <a href="list.html" style="display: block; text-align: center; margin-top: 15px; color: #475569; text-decoration: none; font-size: 14px; font-weight: 500;">📋 กลับไปรายการงานประจำวัน</a>
      </form>
    </div>

    <nav class="bottom-nav">
      <a href="home.html" class="nav-item">
        <i data-feather="home"></i>
        <span>หน้าหลัก</span>
      </a>
      <a href="scan.html" class="nav-item">
        <i data-feather="maximize"></i>
        <span>สแกน</span>
      </a>
      <a href="list.html" class="nav-item">
        <i data-feather="list"></i>
        <span>รายการ</span>
      </a>
      <button onclick="handleLogout()" class="nav-item" style="color: #fda4af; background: none; border: none; font-family: inherit; cursor: pointer;">
        <i data-feather="log-out"></i>
        <span>ออกจากระบบ</span>
      </button>
    </nav>
  </body>
</html>
