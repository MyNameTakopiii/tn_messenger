<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TN Messenger Service - สแกน QR Code</title>

  <script>
    if (!localStorage.getItem("tn_employee_token")) {
      window.location.href = "login_employee.html";
    }
  </script>
  <link rel="stylesheet" href="/src/styles/global.css" />
  <link rel="stylesheet" href="/src/styles/scan.css" />
  <script type="module" src="/src/js/scan.js"></script>
  </head>

  <body>
    <div id="loading-overlay" style="display: none;">
      <div style="text-align: center">
        <i
          data-feather="loader"
          style="
            width: 48px;
            height: 48px;
            color: var(--primary);
            animation: spin 1s linear infinite;
          "
        ></i>
      </div>
    </div>

    <div class="scan-container" id="main-container">
      <div id="mini-loader">
        <i
          data-feather="loader"
          class="spin"
          style="width: 24px; height: 24px; color: var(--success)"
        ></i>
      </div>

      <div class="scan-header">
        <i
          data-feather="maximize"
          id="header-icon"
          style="width: 28px; height: 28px; color: var(--primary);"
        ></i>
        <div>
          <h2>ยิงรับงานประจำวัน (QR Code)</h2>
          <p class="scan-desc">สแกนใบสั่งงานเพื่อลงทะเบียนรับงานเข้าเครื่อง</p>
        </div>
      </div>

      <div class="batch-count-badge" id="batchCountBadge">
        สแกนรับงานแล้ววันนี้: <strong id="batchCount">0</strong> ใบ
      </div>

      <div id="toastAlert" class="toast-alert" style="display: none;"></div>

      <div id="reader"></div>

      <!-- ช่องกรอก/กดเลขที่ใบสั่งงานด้วยตนเอง -->
      <div class="manual-scan-box">
        <label for="manualOrderNo">✍️ หรือกด/กรอกเลขที่ใบสั่งงาน (Order No.):</label>
        <div class="input-with-button">
          <input type="text" id="manualOrderNo" placeholder="เช่น 0001 หรือ 25" inputmode="numeric" />
          <button type="button" id="btnManualScan" class="btn-manual-scan">
            <i data-feather="check-circle"></i> บันทึกรับงาน
          </button>
        </div>
      </div>

      <div class="scan-actions">
        <a href="list.html" class="btn-view-list">
          <i data-feather="list"></i> ดูรายการงานวันนี้ (<span id="btnTaskCount">0</span>)
        </a>
      </div>

      <div id="scannedLog" class="scanned-log">
        <div class="log-title">📋 รายการที่ยิงรับแล้วในเซสชันนี้</div>
        <div id="logItems" class="log-items">
          <div class="empty-log">ยังไม่มีรายการที่ยิงในเซสชันนี้</div>
        </div>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="home.html" class="nav-item">
        <i data-feather="home"></i>
        <span>หน้าหลัก</span>
      </a>
      <a href="scan.html" class="nav-item active">
        <i data-feather="maximize"></i>
        <span>สแกน</span>
      </a>
      <a href="list.html" class="nav-item">
        <i data-feather="list"></i>
        <span>รายการ</span>
      </a>
      <button onclick="handleLogout()" class="nav-item" style="color: #fda4af">
        <i data-feather="log-out"></i>
        <span>ออกจากระบบ</span>
      </button>
    </nav>


  </body>
</html>
