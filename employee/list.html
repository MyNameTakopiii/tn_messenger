<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TN Messenger Service - รายการงาน</title>

  <script>
    if (!localStorage.getItem("tn_employee_token")) {
      window.location.href = "login_employee.html";
    }
  </script>
  <link rel="stylesheet" href="/src/styles/global.css" />
  <link rel="stylesheet" href="/src/styles/list.css" />
  <script type="module" src="/src/js/list.js"></script>
  </head>

  <body>
    <div class="header">
      <h2>รายการงานวันนี้</h2>
    </div>

    <div id="task-container">
      <div id="loading-state">
        <i data-feather="loader" class="spin"></i>
        <p>กำลังโหลดข้อมูล...</p>
      </div>
    </div>

    <!-- Modal รายละเอียด -->
    <div id="detail-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modal-title">รายละเอียดงาน</h3>
          <span class="close-modal" onclick="closeModal()"
            ><i data-feather="x"></i
          ></span>
        </div>
        <div id="modal-body" class="detail-list">
          <!-- ข้อมูลจะถูกใส่ที่นี่ -->
        </div>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="home.html" class="nav-item">
        <i data-feather="home"></i>
        <span>หน้าหลัก</span>
      </a>
      <a href="scan.html" class="nav-item">
        <i data-feather="maximize"></i>
        <span>สแกน</span>
      </a>
      <a href="list.html" class="nav-item active">
        <i data-feather="list"></i>
        <span>รายการ</span>
      </a>
      <button onclick="handleLogout()" class="nav-item" style="color: #fda4af">
        <i data-feather="log-out"></i>
        <span>ออกจากระบบ</span>
      </button>
    </nav>


  </body>
</html>
