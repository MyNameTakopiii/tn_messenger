<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TN Messenger Service - ลืมรหัสผ่านพนักงาน</title>

  <link rel="stylesheet" href="/src/styles/global.css" />
  <link rel="stylesheet" href="/src/styles/login_employee.css" />
</head>

<body>

  <div class="login-container">
    <div class="login-logo">TN</div>
    <h2>ลืมรหัสผ่านพนักงาน</h2>
    <p>กรอกอีเมลและรหัสผ่านใหม่เพื่อทำการเปลี่ยนรหัสผ่าน</p>

    <form onsubmit="handleResetPassword(event)">
      <div class="form-group">
        <label>Email *</label>
        <input type="email" id="email" placeholder="example@email.com" required>
      </div>

      <div class="form-group">
        <label>รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร) *</label>
        <input type="password" id="newPassword" minlength="6" required>
        <i data-feather="eye-off" class="toggle-password" onclick="togglePassword('newPassword')"></i>
      </div>

      <div class="form-group">
        <label>ยืนยันรหัสผ่านใหม่ *</label>
        <input type="password" id="confirmPassword" minlength="6" required>
        <i data-feather="eye-off" class="toggle-password" onclick="togglePassword('confirmPassword')"></i>
      </div>

      <div id="resetMessage" style="min-height:20px; margin-bottom: 20px;"></div>

      <button type="submit" class="login-button">
        <i data-feather="key"></i> เปลี่ยนรหัสผ่าน
      </button>
    </form>

    <div class="redirect-link">
      จำรหัสผ่านได้แล้ว? <a href="login_employee.html">กลับไปหน้าเข้าสู่ระบบ</a>
    </div>
  </div>

  <script type="module" src="/src/js/forgot_password.js"></script>

</body>

</html>
