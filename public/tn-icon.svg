<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bgGrad)" />

  <!-- Inner accent ring -->
  <rect x="24" y="24" width="464" height="464" rx="95" ry="95" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Lightning / Fast Delivery Wings -->
  <path d="M 330 130 L 210 270 L 280 270 L 180 390 L 300 250 L 230 250 Z" fill="rgba(255,255,255,0.18)" />

  <!-- Text TN -->
  <g filter="url(#shadow)">
    <text x="256" y="325" font-family="'Prompt', 'Inter', 'Arial', sans-serif" font-size="220" font-weight="900" text-anchor="middle" fill="url(#textGrad)" letter-spacing="-6">TN</text>
  </g>

  <!-- Badge Subtext -->
  <rect x="136" y="365" width="240" height="44" rx="22" ry="22" fill="#ffffff" />
  <text x="256" y="394" font-family="'Prompt', 'Inter', 'Arial', sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#1e3a8a" letter-spacing="2">MESSENGER</text>
</svg>
