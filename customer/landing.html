<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TN Messenger Service</title>
  <!-- PWA & Mobile Settings -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1e3a8a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TN Messenger" />
  <link rel="apple-touch-icon" href="/tn-icon.svg" />
  <link rel="icon" type="image/svg+xml" href="/tn-icon.svg" />
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/feather-icons"></script>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #3b82f6;
      --text: #111827;
      --text-light: #6b7280;
      --bg: #f3f4f6;
      --white: #ffffff;
      --border: #d1d5db;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Prompt", sans-serif;
      background: var(--bg);
      min-height: 100vh;
      padding: 24px;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 32px;
      padding-top: 20px;
    }
    header h1 {
      color: var(--primary);
      font-size: 28px;
      margin-bottom: 8px;
    }
    header p {
      color: var(--text-light);
      font-size: 16px;
    }
    .cards {
      display: grid;
      gap: 16px;
    }
    .card {
      background: var(--white);
      border-radius: 16px;
      padding: 24px;
      border-top: 6px solid var(--primary);
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.12);
    }
    .card.primary {
      border-top-width: 8px;
      padding: 28px;
    }
    .card-icon {
      width: 48px;
      height: 48px;
      background: #eff6ff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      margin-bottom: 14px;
    }
    .card.primary .card-icon {
      width: 56px;
      height: 56px;
    }
    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .card.primary .card-title { font-size: 22px; }
    .card-desc {
      font-size: 14px;
      color: var(--text-light);
      line-height: 1.5;
    }
    .card-action {
      margin-top: 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--primary-light);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>TN MESSENGER SERVICE</h1>
      <p>ระบบจัดการใบสั่งงานและติดตามการจัดส่ง</p>
    </header>

    <div class="cards">
      <a href="/admin/index.html" class="card primary">
        <div class="card-icon"><i data-feather="file-plus"></i></div>
        <div class="card-title">สร้างใบสั่งงาน</div>
        <div class="card-desc">เพิ่มข้อมูลใบสั่งงาน มอบหมายพนักงาน และบันทึกลงระบบทันที</div>
        <div class="card-action">เริ่มสร้างใบสั่งงาน <i data-feather="arrow-right"></i></div>
      </a>

      <div class="grid-3">
        <a href="/admin/dashboard.html" class="card">
          <div class="card-icon"><i data-feather="grid"></i></div>
          <div class="card-title">Admin</div>
          <div class="card-desc">Dashboard ตารางงาน รายงาน</div>
          <div class="card-action">เข้าสู่ระบบ <i data-feather="arrow-right"></i></div>
        </a>
        <a href="/employee/login_employee.html" class="card">
          <div class="card-icon"><i data-feather="truck"></i></div>
          <div class="card-title">พนักงาน</div>
          <div class="card-desc">รับงาน สแกน QR อัปเดตสถานะ</div>
          <div class="card-action">เข้าสู่ระบบ <i data-feather="arrow-right"></i></div>
        </a>
        <a href="/customer/customer_dashboard.html" class="card">
          <div class="card-icon"><i data-feather="users"></i></div>
          <div class="card-title">ลูกค้า</div>
          <div class="card-desc">สร้างใบสั่งงาน เช็คสถานะ</div>
          <div class="card-action">เข้าใช้งาน <i data-feather="arrow-right"></i></div>
        </a>
      </div>
    </div>
  </div>
  <script>feather.replace();</script>
</body>
</html>
